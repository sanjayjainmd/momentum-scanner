name: Momentum Scanner

on:
  schedule:
    - cron: "0 13 * * 1-5"    # 8:00 AM ET Mon–Fri (13:00 UTC)
  workflow_dispatch:            # manual trigger from Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js deprecation warning

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run momentum scanner
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET:  ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL:    https://paper-api.alpaca.markets
          GMAIL_SENDER:       Sanjayja@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT:    Sanjayja@gmail.com
          RENDER_URL:         ${{ secrets.RENDER_URL }}
        run: python runner.py
